name = "mobdeals-meta-automation-suite"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[assets]
directory = "./dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/health", "/webhooks/*" ]

[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
OUTBOUND_ACTIONS_ENABLED = "false"

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
OUTBOUND_ACTIONS_ENABLED = "false"

[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
OUTBOUND_ACTIONS_ENABLED = "false"

# Queue bindings and the Cron Trigger are introduced with their processors in
# phases 3-5. Until then, meta_webhook_events is the durable database queue.
