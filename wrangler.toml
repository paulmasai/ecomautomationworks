# Keep unqualified development commands separate from the production Worker.
name = "ecomautomationworks-development"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[triggers]
crons = [ "*/5 * * * *" ]

[assets]
directory = "./dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/health", "/webhooks/*", "/privacy", "/privacy/", "/privacy-policy", "/privacy-policy/", "/terms", "/terms/", "/terms-of-service", "/terms-of-service/", "/data-deletion", "/data-deletion/*" ]

# ── Development (default, local wrangler dev) ────────────────────────
[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
OUTBOUND_ACTIONS_ENABLED = "false"
PRIVACY_CONTROLLER_NAME = "MobDeals Online Store"
PRIVACY_CONTACT_EMAIL = "mobdealskenya@gmail.com"
PRIVACY_POSTAL_ADDRESS = "00100 Nairobi"

# ── Staging ──────────────────────────────────────────────────────────
[env.staging]
name = "ecomautomationworks-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
OUTBOUND_ACTIONS_ENABLED = "false"
PRIVACY_CONTROLLER_NAME = "MobDeals Online Store"
PRIVACY_CONTACT_EMAIL = "mobdealskenya@gmail.com"
PRIVACY_POSTAL_ADDRESS = "00100 Nairobi"

# ── Production ───────────────────────────────────────────────────────
# Keep the production Worker name and custom domain stable.
[env.production]
name = "ecomautomationworks"
workers_dev = false
routes = [
  { pattern = "meta.ecomautomationworks.com", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
OUTBOUND_ACTIONS_ENABLED = "false"
PRIVACY_CONTROLLER_NAME = "MobDeals Online Store"
PRIVACY_CONTACT_EMAIL = "mobdealskenya@gmail.com"
PRIVACY_POSTAL_ADDRESS = "00100 Nairobi"

# Fail production deploys unless every runtime credential/binding is present
# under the exact case-sensitive name consumed by the Worker. Values remain in
# Cloudflare secrets and local .dev.vars; they are never committed here.
[env.production.secrets]
required = [
  "SUPABASE_URL",
  "SUPABASE_SERVICE_ROLE_KEY",
  "SUPABASE_PUBLISHABLE_KEY",
  "META_APP_ID",
  "META_APP_SECRET",
  "META_PAGE_ID",
  "META_PAGE_ACCESS_TOKEN",
  "META_VERIFY_TOKEN",
  "META_GRAPH_API_VERSION",
  "INTERNAL_ADMIN_SECRET",
]

# Queue bindings are introduced with their phase 4-5 consumers. Until then,
# meta_webhook_events remains the durable database queue.
