name = "mobdeals-meta-automation-suite"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[triggers]
crons = [ "*/5 * * * *" ]

[assets]
directory = "./dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/health", "/webhooks/*" ]

[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
OUTBOUND_ACTIONS_ENABLED = "false"

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
OUTBOUND_ACTIONS_ENABLED = "false"

[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
OUTBOUND_ACTIONS_ENABLED = "false"

# Queue bindings are introduced with their phase 4-5 consumers. Until then,
# meta_webhook_events remains the durable database queue.
