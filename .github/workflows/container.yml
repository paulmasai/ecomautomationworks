name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: verseexplainer-dotcom/meta-automation-suite

jobs:
  build-and-push:
    name: Build and push OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      statuses: write

    steps:
      - name: Report publication started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --silent \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --raw-field state=pending \
            --raw-field context=container/publish \
            --raw-field description="Building and publishing the GHCR image" \
            --raw-field target_url="${RUN_URL}"

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Pull and smoke test published image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -eu

          smoke_vars="${RUNNER_TEMP}/mobdeals-container-smoke.dev.vars"
          smoke_container="mobdeals-meta-automation-smoke"

          cleanup() {
            docker rm --force "${smoke_container}" >/dev/null 2>&1 || true
            rm -f "${smoke_vars}"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' \
            'SUPABASE_URL="https://example.supabase.co"' \
            'SUPABASE_SERVICE_ROLE_KEY="smoke-service-role-key-123456789"' \
            'META_APP_ID="smoke-app-id"' \
            'META_APP_SECRET="smoke-app-secret-123456789"' \
            'META_PAGE_ID="smoke-page-id"' \
            'META_PAGE_ACCESS_TOKEN="smoke-page-access-token-123456789"' \
            'META_VERIFY_TOKEN="smoke-verify-token-123456789"' \
            'META_GRAPH_API_VERSION="v99.0"' \
            'INTERNAL_ADMIN_SECRET="smoke-admin-secret-123456789"' \
            'ENVIRONMENT="development"' \
            'LOG_LEVEL="error"' \
            'OUTBOUND_ACTIONS_ENABLED="false"' \
            > "${smoke_vars}"

          docker pull "${IMAGE_REF}"
          docker run --detach \
            --name "${smoke_container}" \
            --publish 127.0.0.1:18787:8787 \
            --mount "type=bind,source=${smoke_vars},target=/app/.dev.vars,readonly" \
            "${IMAGE_REF}"

          health_response=""
          for attempt in $(seq 1 30); do
            if health_response=$(curl --fail --silent --show-error http://127.0.0.1:18787/health 2>/dev/null); then
              break
            fi
            sleep 1
          done

          printf '%s' "${health_response}" | grep --fixed-strings '"status":"ok"'
          test "$(curl --fail --silent --show-error 'http://127.0.0.1:18787/webhooks/meta?hub.mode=subscribe&hub.verify_token=smoke-verify-token-123456789&hub.challenge=registry-challenge')" = "registry-challenge"
          test "$(docker exec "${smoke_container}" id -u)" = "1000"

      - name: Publish digest summary
        run: |
          {
            echo "## Published container"
            echo
            echo '```text'
            echo "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report publication result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'GHCR image published successfully' || 'GHCR image publication failed' }}
        run: |
          gh api --silent \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --raw-field state="${RESULT}" \
            --raw-field context=container/publish \
            --raw-field description="${DESCRIPTION}" \
            --raw-field target_url="${RUN_URL}"
